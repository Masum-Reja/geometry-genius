<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geometry Genius</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous" />
  </head>

  <body>
    <header class="bg-primary-subtle p-2 mt-5 mx-md-3 text-center">
      <div class="d-sm-flex justify-content-between">
        <div>
          <h3>Interactive</h3>
          <h5 class="fw-normal text-secondary"> Geometry Genius</h5>
        </div>
        <div>
          <button type="button" id="btn-blog" class="btn btn-primary mt-3 px-4">Blog</button>
        </div>
      </div>
    </header>

    <main class="mt-5 mx-lg-3 mx-5 mx-md-3">
      <div class="d-lg-flex gap-4">
        <div class="d-grid">
          <div class="row g-4">
    
            <!-- Triangle -->
    
            <div class="col col-lg-4 text-center mx-5 mx-lg-0">
              <div class="card px-4 pt-lg-5 h-100" style="width: 17rem">
                <img src="images/triangle.png" height="150px" class="card-img-top" alt="..." />
                <div class="card-body mt-3">
                  <h5 class="card-title">Triangle</h5>
                  <p class="card-text">Area (A) = 0.5 &#215;b &#215; h</p>
                  <div class="d-flex my-3 gap-2">
                    <input type="text" name="" id="triangle-b" placeholder="b" class="w-75" />
                    <label for="">cm</label>
                    <input type="text" name="" id="triangle-h" placeholder="h" class="w-75" />
                    <label for="">cm</label>
                  </div>
                  <a id="btn-triangle" class="btn btn-primary btn-lg px-lg-5 w-100 mb-lg-3">Calculate</a>
                </div>
              </div>
            </div>
    
            
    
            
      </div>
    </main>
    


    <script src="js/calculate.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
      crossorigin="anonymous"></script>
  </body>

</html>
